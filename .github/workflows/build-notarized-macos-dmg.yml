name: Build notarized macOS DMG

on:
  workflow_dispatch:
    inputs:
      trooper_ref:
        description: Private Trooper branch, tag, or commit SHA to build
        required: false
        default: main

jobs:
  build-macos:
    runs-on: macos-latest
    environment: production-build
    defaults:
      run:
        working-directory: private-trooper
    permissions:
      contents: write

    env:
      APP_NAME: Trooper
      APPLE_TEAM_ID: L27PMU448G
      DEVELOPER_ID_APPLICATION: "Developer ID Application: Vaibhav Kalra (L27PMU448G)"

    steps:
      - name: Checkout public workflow definitions
        uses: actions/checkout@v5

      - name: Download private Trooper source
        id: trooper
        uses: ./.github/actions/download-private-trooper
        with:
          ref: ${{ inputs.trooper_ref || 'main' }}
          token: ${{ secrets.CRABSHQ_READ_TOKEN }}
          fallback-token: ${{ secrets.CRABSHQ_DISPATCH_TOKEN }}
          clone-token: ${{ secrets.TROOPER_REPO_CLONE_TOKEN }}

      - name: Preflight signing secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
            echo "### macOS release blocked"
            echo ""
            echo "Missing required signing/notarization secrets:"
            for name in "${missing[@]}"; do
              echo "- \`$name\`"
            done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing production macOS signing secrets."
            exit 1
          fi
          echo "SKIP_MACOS_RELEASE=false" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: env.SKIP_MACOS_RELEASE != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-trooper/package-lock.json

      - name: Install Rust stable
        if: env.SKIP_MACOS_RELEASE != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        if: env.SKIP_MACOS_RELEASE != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: private-trooper/src-tauri

      - name: Install npm dependencies
        if: env.SKIP_MACOS_RELEASE != 'true'
        run: npm ci

      - name: Import Developer ID signing certificate
        if: env.SKIP_MACOS_RELEASE != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/trooper-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install App Store Connect API key
        if: env.SKIP_MACOS_RELEASE != 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "Missing APPLE_API_KEY_ID or APPLE_API_KEY_BASE64 for notarization."
            exit 1
          fi
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          echo "API_PRIVATE_KEYS_DIR=$API_PRIVATE_KEYS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Preflight Apple notarization account
        if: env.SKIP_MACOS_RELEASE != 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          NOTARY_PREFLIGHT_LOG="$RUNNER_TEMP/notary-preflight.log"

          set +e
          xcrun notarytool history \
            --key "$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json > "$NOTARY_PREFLIGHT_LOG" 2>&1
          NOTARY_PREFLIGHT_STATUS=$?
          set -e

          if [ "$NOTARY_PREFLIGHT_STATUS" -eq 0 ]; then
            exit 0
          fi

          NOTARY_PREFLIGHT_TEXT="$(cat "$NOTARY_PREFLIGHT_LOG" || true)"
          if echo "$NOTARY_PREFLIGHT_TEXT" | grep -Eiq "required agreement|agreement .*missing|agreement .*expired"; then
            echo "::error title=Apple notarization agreement required::Apple rejected notarization because a required developer agreement is missing or expired. Sign in to the Apple Developer/App Store Connect account for this team and accept the pending agreement, then rerun this workflow."
            {
              echo "### macOS notarization blocked"
              echo ""
              echo "Apple rejected the notarization account before the build because a required developer agreement is missing or expired."
              echo ""
              echo "Account action needed: sign in to the Apple Developer/App Store Connect account for this team, accept the pending agreement, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Apple notarization preflight failed::notarytool history exited with status $NOTARY_PREFLIGHT_STATUS."
          fi
          echo "$NOTARY_PREFLIGHT_TEXT"
          exit "$NOTARY_PREFLIGHT_STATUS"

      - name: Download llama-server backends
        if: env.SKIP_MACOS_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASES_URL="https://api.github.com/repos/AtomicBot-ai/atomic-llama-cpp-turboquant/releases?per_page=100"
          RELEASES_JSON=$(curl -fsSL --retry 3 -H "Authorization: token $GH_TOKEN" -H "User-Agent: Trooper-CI" "$RELEASES_URL")

          IFS=$'\t' read -r ARM64_URL ARM64_TAG < <(echo "$RELEASES_JSON" | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          wanted = 'llama-turboquant-macos-arm64.tar.gz'
          matches = [
              (release, asset)
              for release in releases
              if not release.get('draft') and not release.get('prerelease')
              for asset in (release.get('assets') or [])
              if asset.get('name') == wanted
          ]
          if not matches:
              print('ERROR: arm64 llama backend asset not found', file=sys.stderr)
              print([a.get('name') for r in releases for a in (r.get('assets') or [])], file=sys.stderr)
              sys.exit(1)
          release, asset = matches[0]
          print(asset['browser_download_url'], release['tag_name'], sep='\t')
          ")
          echo "Using arm64 llama backend from release $ARM64_TAG"
          mkdir -p src-tauri/resources/backend-arm64
          curl -fsSL --retry 3 -H "Authorization: token $GH_TOKEN" "$ARM64_URL" | tar xz -C src-tauri/resources/backend-arm64
          if [ ! -f src-tauri/resources/backend-arm64/llama-server ]; then
            FOUND=$(find src-tauri/resources/backend-arm64 -name "llama-server" -type f | head -1)
            if [ -n "$FOUND" ]; then
              SUBDIR=$(dirname "$FOUND")
              mv "$SUBDIR"/* src-tauri/resources/backend-arm64/
            fi
          fi
          chmod +x src-tauri/resources/backend-arm64/llama-server

          IFS=$'\t' read -r X64_URL X64_TAG < <(echo "$RELEASES_JSON" | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          wanted = 'llama-turboquant-macos-x64.tar.gz'
          matches = [
              (release, asset)
              for release in releases
              if not release.get('draft') and not release.get('prerelease')
              for asset in (release.get('assets') or [])
              if asset.get('name') == wanted
          ]
          if matches:
              release, asset = matches[0]
              print(asset['browser_download_url'], release['tag_name'], sep='\t')
          else:
              print('\t')
          ")
          if [ -n "$X64_URL" ]; then
            echo "Using x64 llama backend from release $X64_TAG"
            mkdir -p src-tauri/resources/backend-x64
            curl -fsSL --retry 3 -H "Authorization: token $GH_TOKEN" "$X64_URL" | tar xz -C src-tauri/resources/backend-x64
            if [ ! -f src-tauri/resources/backend-x64/llama-server ]; then
              FOUND=$(find src-tauri/resources/backend-x64 -name "llama-server" -type f | head -1)
              if [ -n "$FOUND" ]; then
                SUBDIR=$(dirname "$FOUND")
                mv "$SUBDIR"/* src-tauri/resources/backend-x64/
              fi
            fi
            chmod +x src-tauri/resources/backend-x64/llama-server
          else
            echo "No stable macOS x64 llama backend is published; continuing with the arm64 bundle."
          fi

      - name: Build native macOS helper
        if: env.SKIP_MACOS_RELEASE != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.DEVELOPER_ID_APPLICATION }}
        run: bash src-tauri/helper/build.sh

      - name: Build Tauri app bundle
        if: env.SKIP_MACOS_RELEASE != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.DEVELOPER_ID_APPLICATION }}
          VITE_BUILD_ID: ${{ steps.trooper.outputs.sha }}
          COMMIT_REF: ${{ steps.trooper.outputs.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXTRA_CONFIG='{}'
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY missing. DMG will still publish, but Check for updates will not move."
            EXTRA_CONFIG='{"bundle":{"createUpdaterArtifacts":false}}'
          fi
          npm run tauri build -- --target universal-apple-darwin --bundles app --config "$EXTRA_CONFIG"

      - name: Place native runtime inside the Trooper framework bundle
        if: env.SKIP_MACOS_RELEASE != 'true'
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No app bundle found."
            exit 1
          fi
          node scripts/relocate-macos-helper.mjs "$APP"
          # Do not ship private helper sources inside a public DMG.
          find "$APP/Contents/Resources/helper" \( -name '*.swift' -o -name '*.mjs' -o -name '*.ts' \) -delete 2>/dev/null || true

      - name: Sign app bundle with hardened runtime
        if: env.SKIP_MACOS_RELEASE != 'true'
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No app bundle found."
            exit 1
          fi
          ENTITLEMENTS_PATH="src-tauri/Entitlements.plist"
          if [ ! -f "$ENTITLEMENTS_PATH" ]; then
            echo "Missing macOS entitlements file: $ENTITLEMENTS_PATH"
            exit 1
          fi

          while IFS= read -r FILE_PATH; do
            if file "$FILE_PATH" | grep -Eq 'Mach-O|dynamically linked shared library|current ar archive'; then
              codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$FILE_PATH"
            fi
          done < <(find "$APP/Contents" -type f -perm -111)

          # This library is loaded into Trooper's own executable process.
          NATIVE_RUNTIME="$APP/Contents/Frameworks/libTrooperNative.dylib"
          if [ -f "$NATIVE_RUNTIME" ]; then
            codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" \
              --identifier "com.trooper.app" "$NATIVE_RUNTIME"
          fi

          # Sign from the inside out. `--deep` here would re-sign the helper
          # with a path-derived identifier and recreate the TCC split we just
          # removed. Reapply the outer app's entitlement here: this is the
          # signature macOS consults when AVFoundation requests microphone
          # access, and an unsigned re-sign would otherwise strip it.
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$DEVELOPER_ID_APPLICATION" "$APP"
          echo "APP_BUNDLE=$APP" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Keep a missing mic capability from becoming a successful-but-broken
          # release. `codesign` writes the entitlement plist to stdout.
          SIGNED_ENTITLEMENTS=$(mktemp)
          codesign -d --entitlements :- "$APP" > "$SIGNED_ENTITLEMENTS" 2>/dev/null
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$SIGNED_ENTITLEMENTS")" != "true" ]; then
            echo "Trooper.app is missing the required Audio Input entitlement."
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.mach-lookup.global-name' "$SIGNED_ENTITLEMENTS" | grep -q 'com.apple.screencapturekit.picker'; then
            echo "Trooper.app is missing the ScreenCaptureKit picker entitlement."
            exit 1
          fi

      - name: Install DMG layout tool
        if: env.SKIP_MACOS_RELEASE != 'true'
        run: brew install create-dmg

      - name: Create signed DMG
        if: env.SKIP_MACOS_RELEASE != 'true'
        id: package
        run: |
          set -euo pipefail
          APP="$APP_BUNDLE"
          APP_NAME=$(basename "$APP" .app)
          DMG_DIR=src-tauri/target/universal-apple-darwin/release/bundle/dmg
          STAGE="$DMG_DIR/stage"
          mkdir -p "$DMG_DIR"
          rm -f "$DMG_DIR"/*.dmg
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          DMG_PATH="$DMG_DIR/${APP_NAME}.dmg"
          DMG_BACKGROUND="$RUNNER_TEMP/trooper-dmg-background.png"

          ditto "$APP" "$STAGE/${APP_NAME}.app"
          swift scripts/render-macos-dmg-background.swift "$DMG_BACKGROUND"

          set +e
          create-dmg \
            --volname "$APP_NAME Installer" \
            --volicon "src-tauri/icons/icon.icns" \
            --background "$DMG_BACKGROUND" \
            --window-pos 200 120 \
            --window-size 800 500 \
            --text-size 14 \
            --icon-size 128 \
            --icon "${APP_NAME}.app" 220 250 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 580 250 \
            --no-internet-enable \
            "$DMG_PATH" \
            "$STAGE"
          CREATE_DMG_STATUS=$?
          set -e

          if [ "$CREATE_DMG_STATUS" -ne 0 ] && [ "$CREATE_DMG_STATUS" -ne 2 ]; then
            echo "create-dmg failed with status $CREATE_DMG_STATUS"
            exit "$CREATE_DMG_STATUS"
          fi
          test -f "$DMG_PATH"

          codesign --force --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$DMG_PATH"
          DMG_NAME=$(basename "$DMG_PATH")
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        if: env.SKIP_MACOS_RELEASE != 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="${{ steps.package.outputs.path }}"

          NOTARY_SUBMIT_JSON="$RUNNER_TEMP/notary-submit.json"
          NOTARY_LOG_JSON="$RUNNER_TEMP/notary-log.json"

          set +e
          xcrun notarytool submit "$DMG" \
            --key "$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json | tee "$NOTARY_SUBMIT_JSON"
          NOTARY_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$NOTARY_STATUS" -ne 0 ]; then
            NOTARY_ERROR_TEXT="$(cat "$NOTARY_SUBMIT_JSON" || true)"
            if echo "$NOTARY_ERROR_TEXT" | grep -Eiq "required agreement|agreement .*missing|agreement .*expired"; then
              echo "::error title=Apple notarization agreement required::Apple rejected notarization because a required developer agreement is missing or expired. Sign in to the Apple Developer/App Store Connect account for this team and accept the pending agreement, then rerun this workflow."
              {
                echo "### macOS notarization blocked"
                echo ""
                echo "Apple rejected the notarization request because a required developer agreement is missing or expired."
                echo ""
                echo "Account action needed: sign in to the Apple Developer/App Store Connect account for this team, accept the pending agreement, then rerun this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Apple notarization failed::notarytool submit exited with status $NOTARY_STATUS."
            fi
            echo "$NOTARY_ERROR_TEXT"
            exit "$NOTARY_STATUS"
          fi

          read_notary_field() {
            local field="$1"
            python3 - "$NOTARY_SUBMIT_JSON" "$field" <<'PY'
          import json, sys
          path, field = sys.argv[1], sys.argv[2]
          try:
              with open(path, "r", encoding="utf-8") as fh:
                  data = json.load(fh)
          except json.JSONDecodeError as exc:
              print(f"::error title=Invalid notarytool output::Expected JSON from notarytool but got unparsable output: {exc}", file=sys.stderr)
              sys.exit(2)
          print(data.get(field) or "")
          PY
          }

          SUBMISSION_ID=$(read_notary_field id)
          SUBMISSION_STATUS=$(read_notary_field status)

          if [ -n "$SUBMISSION_ID" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --output-format json | tee "$NOTARY_LOG_JSON" || true
          fi

          if [ "$NOTARY_STATUS" -ne 0 ] || [ "$SUBMISSION_STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: ${SUBMISSION_STATUS:-unknown}"
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify Gatekeeper acceptance
        if: env.SKIP_MACOS_RELEASE != 'true'
        run: |
          set -euo pipefail
          DMG="${{ steps.package.outputs.path }}"
          APP_NAME=$(basename "$APP_BUNDLE" .app)
          MOUNT_DIR="$RUNNER_TEMP/trooper-dmg-mount"
          rm -rf "$MOUNT_DIR"
          mkdir -p "$MOUNT_DIR"

          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT_DIR" -quiet || true' EXIT

          test -L "$MOUNT_DIR/Applications"
          test -f "$MOUNT_DIR/.DS_Store"
          test -f "$MOUNT_DIR/.background/trooper-dmg-background.png"
          spctl --assess --type execute --verbose=4 "$MOUNT_DIR/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/${APP_NAME}.app"

      - name: Upload DMG artifact
        if: env.SKIP_MACOS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Trooper-macos-notarized-dmg
          path: private-trooper/${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish repository latest macOS release
        if: env.SKIP_MACOS_RELEASE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="${{ steps.package.outputs.path }}"
          CHECKSUM="${DMG}.sha256"
          shasum -a 256 "$DMG" | sed "s#  .*#  Trooper.dmg#" > "$CHECKSUM"

          gh release delete macos-latest \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes >/dev/null 2>&1 || true

          VERSION="$(node -p "require('./package.json').version")"
          gh release create macos-latest "$DMG" "$CHECKSUM" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Trooper for macOS ${VERSION}" \
            --notes "Trooper ${VERSION}. Latest signed and notarized Trooper macOS installer. Built from absurdfounder/Trooper@${{ steps.trooper.outputs.sha }}." \
            --latest

      - name: Mirror DMG to install URLs (private Trooper + landing)
        if: env.SKIP_MACOS_RELEASE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TROOPER_SHA: ${{ steps.trooper.outputs.sha }}
        run: bash "$GITHUB_WORKSPACE/scripts/mirror-macos-dmg-release.sh" "${{ steps.package.outputs.path }}"
