name: App — Mac DMG

on:
  workflow_dispatch:
    inputs:
      trooper_ref:
        description: Private Trooper branch, tag, or commit SHA to build
        required: false
        default: main

jobs:
  electron:
    uses: ./.github/workflows/build-notarized-electron-macos.yml
    with:
      trooper_ref: ${{ inputs.trooper_ref || 'main' }}
    secrets: inherit
