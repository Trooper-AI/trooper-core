name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      trooper_ref:
        description: Private Trooper branch, tag, or commit SHA to build
        required: true
        default: main

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production-build
    defaults:
      run:
        working-directory: private-trooper
    permissions:
      contents: write

    steps:
      - name: Checkout public workflow definitions
        uses: actions/checkout@v5

      - name: Download private Trooper source
        id: trooper
        uses: ./.github/actions/download-private-trooper
        with:
          ref: ${{ inputs.trooper_ref || 'main' }}
          token: ${{ secrets.CRABSHQ_READ_TOKEN }}
          fallback-token: ${{ secrets.CRABSHQ_DISPATCH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-trooper/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: private-trooper/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run prebuild
          npx tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":"node scripts/run-with-system-node.mjs node_modules/vite/bin/vite.js build"},"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prepare stable download
        shell: pwsh
        run: |
          $Installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $Installer) { throw "No NSIS installer was produced." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $Installer.FullName "release/Trooper-Windows-x64-Setup.exe"
          Get-FileHash "release/Trooper-Windows-x64-Setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Trooper-Windows-x64-Setup.exe" } |
            Set-Content "release/Trooper-Windows-x64-Setup.exe.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trooper-Windows-x64
          path: private-trooper/release/*

      - name: Publish stable Windows download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create windows-latest \
              --repo "${{ github.repository }}" \
              --title "Trooper for Windows" \
              --notes "Latest Windows desktop installer."
          gh release upload windows-latest release/* \
            --repo "${{ github.repository }}" \
            --clobber
