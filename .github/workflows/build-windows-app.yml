name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      trooper_ref:
        description: Private Trooper branch, tag, or commit SHA to build
        required: true
        default: main

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production-build
    defaults:
      run:
        working-directory: private-trooper
    permissions:
      contents: write

    steps:
      - name: Checkout public workflow definitions
        uses: actions/checkout@v5

      - name: Download private Trooper source
        id: trooper
        uses: ./.github/actions/download-private-trooper
        with:
          ref: ${{ inputs.trooper_ref || 'main' }}
          token: ${{ secrets.CRABSHQ_READ_TOKEN }}
          fallback-token: ${{ secrets.CRABSHQ_DISPATCH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-trooper/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: private-trooper/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npm run prebuild
          EXTRA_CONFIG='{"build":{"beforeBuildCommand":"node scripts/run-with-system-node.mjs node_modules/vite/bin/vite.js build","beforeBundleCommand":""}}'
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY missing. Installer will still publish, but Check for updates will not move."
            EXTRA_CONFIG='{"build":{"beforeBuildCommand":"node scripts/run-with-system-node.mjs node_modules/vite/bin/vite.js build","beforeBundleCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
          fi
          npx tauri build --bundles nsis --config "$EXTRA_CONFIG"

      - name: Prepare stable download
        shell: pwsh
        run: |
          $Installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $Installer) { throw "No NSIS installer was produced." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $Installer.FullName "release/Trooper-Windows-x64-Setup.exe"
          $Signature = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if ($Signature) {
            Copy-Item $Signature.FullName "release/Trooper-Windows-x64-Setup.exe.sig"
          }
          Get-FileHash "release/Trooper-Windows-x64-Setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Trooper-Windows-x64-Setup.exe" } |
            Set-Content "release/Trooper-Windows-x64-Setup.exe.sha256"
          $Version = node -p "require('./package.json').version"
          $SignatureText = if (Test-Path "release/Trooper-Windows-x64-Setup.exe.sig") { (Get-Content "release/Trooper-Windows-x64-Setup.exe.sig" -Raw).Trim() } else { "" }
          $Manifest = @{
            version = $Version
            notes = "Trooper $Version. Latest signed Trooper desktop update."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $SignatureText
                url = "https://github.com/absurdfounder/trooper_landing/releases/download/windows-latest/Trooper-Windows-x64-Setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content "release/latest.json" $Manifest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trooper-Windows-x64
          path: private-trooper/release/*

      - name: Publish stable Windows download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NOTES="Trooper ${VERSION}. Latest Windows desktop installer. Built from absurdfounder/Trooper@${{ steps.trooper.outputs.sha }}."
          TITLE="Trooper for Windows ${VERSION}"
          for repo in "${{ github.repository }}"; do
            gh release view windows-latest --repo "$repo" >/dev/null 2>&1 || \
              gh release create windows-latest --repo "$repo" --title "$TITLE" --notes "$NOTES"
            gh release edit windows-latest --repo "$repo" --title "$TITLE" --notes "$NOTES"
            gh release upload windows-latest release/* --repo "$repo" --clobber
          done
          if [ -n "${PUBLIC_RELEASE_TOKEN:-}" ]; then
            export GH_TOKEN="$PUBLIC_RELEASE_TOKEN"
            for repo in absurdfounder/trooper_landing; do
              gh release view windows-latest --repo "$repo" >/dev/null 2>&1 || \
                gh release create windows-latest --repo "$repo" --title "$TITLE" --notes "$NOTES"
              gh release edit windows-latest --repo "$repo" --title "$TITLE" --notes "$NOTES"
              gh release upload windows-latest release/* --repo "$repo" --clobber
              gh release view windows-x86_64-latest --repo "$repo" >/dev/null 2>&1 || \
                gh release create windows-x86_64-latest --repo "$repo" --title "Trooper Windows ${VERSION} auto-update feed" --notes "$NOTES"
              gh release upload windows-x86_64-latest release/* --repo "$repo" --clobber
            done
          else
            echo "::warning::PUBLIC_RELEASE_TOKEN missing; landing windows-latest feed was not updated."
          fi
          if [ ! -f release/Trooper-Windows-x64-Setup.exe.sig ]; then
            echo "::error::No updater signature. Check for updates will not move until TAURI_SIGNING_PRIVATE_KEY is set."
            exit 1
          fi
