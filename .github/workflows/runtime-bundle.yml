name: Request Private Trooper Fallback CI

# This public repository is a control plane only. It must never clone,
# archive, cache, or upload source from absurdfounder/Trooper.
#
# A maintainer can request the private fallback from the Actions page when
# normal Trooper CI needs a clean retry. The actual checkout, build, logs, and
# test output remain in the private Trooper repository.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is the private fallback needed?"
        required: true
        default: "Manual fallback requested from trooper-core"
  repository_dispatch:
    types: [trooper-actions-fallback-request]

permissions:
  contents: read

concurrency:
  group: request-private-trooper-fallback
  cancel-in-progress: false

jobs:
  request-private-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request private fallback CI
        env:
          RAW_DISPATCH_TOKEN: ${{ secrets.CRABSHQ_DISPATCH_TOKEN }}
          EVENT_REASON: ${{ inputs.reason || github.event.client_payload.reason || 'Fallback requested from trooper-core' }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "${RAW_DISPATCH_TOKEN:-}" | tr -d '\r\n[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::CRABSHQ_DISPATCH_TOKEN is required. It needs Actions: write access to absurdfounder/Trooper."
            exit 1
          fi
          echo "::add-mask::$token"

          payload="$(jq -nc \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg reason "$EVENT_REASON" \
            '{event_type: "trooper-core-fallback-ci", client_payload: {source_repo: $source_repo, source_sha: $source_sha, reason: $reason}}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/absurdfounder/Trooper/dispatches \
            -d "$payload"

          {
            echo "### Private fallback requested"
            echo ""
            echo "The private Trooper repository received the request. Its source, build logs, and test output stay private."
            echo "Reason: ${EVENT_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"
