name: Build Private Trooper Fallback

# This is deliberately a public-repository workflow, so standard GitHub-hosted
# Ubuntu runner time is free. It checks out the private Trooper repository with
# a read-only credential, but it must never upload, cache, or release private
# workspace content. GitHub Actions logs for this repository are visible to
# every reader of trooper-core; build output is intentionally retained to make
# ordinary CI debugging work like a normal GitHub Actions workflow.
#
# The job is manual-only. Keep trooper-core's default branch protected and do
# not add pull_request or repository_dispatch triggers: a public fork must
# never be able to run a job that receives the private checkout credential.

on:
  workflow_dispatch:
    inputs:
      trooper_ref:
        description: "Private Trooper branch, tag, or commit SHA to build"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: public-trooper-fallback-${{ inputs.trooper_ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: Private Trooper build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download private Trooper source
        env:
          RAW_READ_TOKEN: ${{ secrets.CRABSHQ_READ_TOKEN }}
          RAW_DISPATCH_TOKEN: ${{ secrets.CRABSHQ_DISPATCH_TOKEN }}
          TROOPER_REF: ${{ inputs.trooper_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TROOPER_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]] || [[ "$TROOPER_REF" == *..* ]]; then
            echo "::error::The requested Trooper ref is not valid."
            exit 1
          fi

          try_token() {
            local candidate="${1:-}"
            [ -n "$candidate" ] || return 1
            echo "::add-mask::$candidate"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $candidate" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/absurdfounder/Trooper \
              -o /dev/null 2>/dev/null
          }

          private_token=''
          if try_token "${RAW_READ_TOKEN:-}"; then
            private_token="$RAW_READ_TOKEN"
          elif try_token "${RAW_DISPATCH_TOKEN:-}"; then
            private_token="$RAW_DISPATCH_TOKEN"
          else
            echo "::error::No Core secret can read the private Trooper repository. Configure a fine-grained token with Contents: read access to absurdfounder/Trooper."
            exit 1
          fi

          archive="$RUNNER_TEMP/private-trooper.tar.gz"
          destination="$GITHUB_WORKSPACE/private-trooper"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $private_token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$archive" \
            "https://api.github.com/repos/absurdfounder/Trooper/tarball/$TROOPER_REF"
          tar -xzf "$archive" -C "$destination" --strip-components=1
          rm -f "$archive"
          test -f "$destination/package.json"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Upgrade npm
        working-directory: private-trooper
        run: npm install --global npm@11

      - name: Install web dependencies
        working-directory: private-trooper
        run: npm ci

      - name: Verify web production dependencies
        working-directory: private-trooper
        run: node scripts/audit-gate.mjs .

      - name: Lint critical modules
        working-directory: private-trooper
        run: npm run lint

      - name: Run web smoke tests
        working-directory: private-trooper
        run: npm run test:smoke

      - name: Run frontend tests
        working-directory: private-trooper
        run: npm run test:frontend

      - name: Build web app
        working-directory: private-trooper
        run: npm run build

      - name: Install server dependencies
        working-directory: private-trooper
        run: npm --prefix server ci

      - name: Verify server production dependencies
        working-directory: private-trooper
        run: node scripts/audit-gate.mjs server

      - name: Run server tests
        working-directory: private-trooper
        run: npm --prefix server test

      - name: Install function dependencies
        working-directory: private-trooper
        run: npm --prefix functions ci

      - name: Run Firebase emulator tests
        working-directory: private-trooper
        run: npx --yes firebase-tools@14.20.0 emulators:exec --only firestore,database "npm --prefix functions test"
