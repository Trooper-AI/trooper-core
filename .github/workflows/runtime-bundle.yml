name: Build Private Trooper Fallback

# This is deliberately a public-repository workflow, so standard GitHub-hosted
# Ubuntu runner time is free. It checks out the private Trooper repository with
# a read-only credential, but it must never upload, cache, release, or print
# private workspace content. GitHub Actions logs for this repository are
# visible to every reader of trooper-core.
#
# The job is manual-only. Keep trooper-core's default branch protected and do
# not add pull_request or repository_dispatch triggers: a public fork must
# never be able to run a job that receives the private checkout credential.

on:
  workflow_dispatch:
    inputs:
      trooper_ref:
        description: "Private Trooper branch, tag, or commit SHA to build"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: public-trooper-fallback-${{ inputs.trooper_ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: Private Trooper build (sanitized output)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify checkout credential
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.CRABSHQ_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_READ_TOKEN:-}" ]; then
            echo "::error::CRABSHQ_READ_TOKEN is required. It must have Contents: read access to absurdfounder/Trooper only."
            exit 1
          fi
          echo "::add-mask::$PRIVATE_READ_TOKEN"

      - name: Checkout private Trooper source
        uses: actions/checkout@v5
        with:
          repository: absurdfounder/Trooper
          ref: ${{ inputs.trooper_ref }}
          token: ${{ secrets.CRABSHQ_READ_TOKEN }}
          path: private-trooper
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Test and build private Trooper
        working-directory: private-trooper
        shell: bash
        run: |
          set -euo pipefail

          # The raw tools can print source paths, test names, stack traces, and
          # code excerpts. Capture them only on the disposable GitHub runner;
          # publish a stable, non-sensitive result to this public log instead.
          run_private_step() {
            local label="$1"
            shift
            local log_file="$RUNNER_TEMP/trooper-${label}.log"

            echo "::group::${label}"
            if "$@" >"$log_file" 2>&1; then
              echo "Completed"
              echo "::endgroup::"
              return 0
            fi

            rm -f "$log_file"
            echo "::endgroup::"
            echo "::error title=${label} failed::The private build step failed. Detailed output is intentionally withheld from this public repository."
            exit 1
          }

          run_private_step "Upgrade npm" npm install --global npm@11
          run_private_step "Install web dependencies" npm ci
          run_private_step "Verify web production dependencies" node scripts/audit-gate.mjs .
          run_private_step "Lint critical modules" npm run lint
          run_private_step "Run web smoke tests" npm run test:smoke
          run_private_step "Run frontend tests" npm run test:frontend
          run_private_step "Build web app" npm run build
          run_private_step "Install server dependencies" npm --prefix server ci
          run_private_step "Verify server production dependencies" node scripts/audit-gate.mjs server
          run_private_step "Run server tests" npm --prefix server test
          run_private_step "Install function dependencies" npm --prefix functions ci
          run_private_step "Run Firebase emulator tests" npx --yes firebase-tools@14.20.0 emulators:exec --only firestore,database "npm --prefix functions test"

          # Do not write a GITHUB_STEP_SUMMARY here: public summaries must not
          # contain private filenames, source paths, or command output.
