name: Build Capacitor iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      trooper_ref:
        description: Private Trooper branch, tag, or commit SHA to build
        required: true
        default: main
      marketing_version:
        description: "Optional CFBundleShortVersionString override, for example 1.0.2"
        required: false
        type: string
      build_number:
        description: "Optional CFBundleVersion override. Defaults to the run number."
        required: false
        type: string

concurrency:
  group: capacitor-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload-testflight:
    runs-on: macos-latest
    environment: production-build
    defaults:
      run:
        working-directory: private-trooper
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      APPLE_TEAM_ID: "${{ vars.APPLE_TEAM_ID || 'L27PMU448G' }}"
      BUNDLE_IDENTIFIER: com.trooper.app

    steps:
      - name: Checkout public workflow definitions
        uses: actions/checkout@v5

      - name: Download private Trooper source
        id: trooper
        uses: ./.github/actions/download-private-trooper
        with:
          ref: ${{ inputs.trooper_ref || 'main' }}
          token: ${{ secrets.CRABSHQ_READ_TOKEN }}
          fallback-token: ${{ secrets.CRABSHQ_DISPATCH_TOKEN }}

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_26.3.app/Contents/Developer"
          if [ ! -d "$XCODE_PATH" ]; then
            XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
            if [ -z "$XCODE_APP" ]; then
              echo "Xcode 26 is required for App Store uploads but is not installed." >&2
              exit 1
            fi
            XCODE_PATH="$XCODE_APP/Contents/Developer"
          fi

          echo "DEVELOPER_DIR=$XCODE_PATH" >> "$GITHUB_ENV"
          sudo xcode-select --switch "$XCODE_PATH"
          export DEVELOPER_DIR="$XCODE_PATH"
          test "$(xcode-select --print-path)" = "$XCODE_PATH"
          xcodebuild -version
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$IOS_SDK_VERSION" in
            26.*) ;;
            *)
              echo "Expected the iOS 26 SDK, got $IOS_SDK_VERSION" >&2
              exit 1
              ;;
          esac

      - name: Preflight App Store Connect secrets
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### Capacitor iOS TestFlight upload cannot start"
              echo ""
              echo "Add these GitHub Secrets, then run this workflow again:"
              for name in "${missing[@]}"; do
                echo "- \`$name\`"
              done
              echo ""
              echo "Optional repository variable:"
              echo "- \`APPLE_TEAM_ID\` defaults to \`L27PMU448G\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            private-trooper/package-lock.json
            private-trooper/apps/capacitor/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix apps/capacitor ci

      - name: Install App Store Connect API key, certificate, and provisioning profile
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          API_PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          echo "API_PRIVATE_KEYS_DIR=$API_PRIVATE_KEYS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          APPLE_API_KEY_PATH="$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"

          KEYCHAIN_PATH="$RUNNER_TEMP/trooper-capacitor-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/Trooper_Capacitor_App_Store.mobileprovision"

          if [ -n "${APPLE_DISTRIBUTION_CERTIFICATE_BASE64:-}" ] &&
             [ -n "${APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ] &&
             [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          else
            echo "Distribution signing secrets are incomplete; creating temporary App Store signing assets."
            SIGNING_PRIVATE_KEY="$RUNNER_TEMP/apple_distribution.key"
            SIGNING_CSR="$RUNNER_TEMP/apple_distribution.csr"
            SIGNING_CERTIFICATE="$RUNNER_TEMP/apple_distribution.cer"
            SIGNING_CERTIFICATE_PEM="$RUNNER_TEMP/apple_distribution.pem"
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD="$(openssl rand -base64 24)"

            openssl genrsa -out "$SIGNING_PRIVATE_KEY" 2048
            openssl req -new \
              -key "$SIGNING_PRIVATE_KEY" \
              -out "$SIGNING_CSR" \
              -subj "/CN=Trooper Capacitor CI Apple Distribution/O=Trooper/C=US"

            APPLE_API_KEY_ID="$APPLE_API_KEY_ID" \
            APPLE_API_ISSUER_ID="$APPLE_API_ISSUER_ID" \
            APPLE_API_KEY_PATH="$APPLE_API_KEY_PATH" \
            CSR_PATH="$SIGNING_CSR" \
            CERTIFICATE_PATH="$SIGNING_CERTIFICATE" \
            PROFILE_PATH="$PROFILE_PATH" \
            PROFILE_NAME="Trooper Capacitor App Store CI ${GITHUB_RUN_ID}" \
            BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
              node scripts/ios/create-app-store-signing-assets.mjs

            openssl x509 \
              -inform DER \
              -in "$SIGNING_CERTIFICATE" \
              -out "$SIGNING_CERTIFICATE_PEM"
            openssl pkcs12 -export \
              -inkey "$SIGNING_PRIVATE_KEY" \
              -in "$SIGNING_CERTIFICATE_PEM" \
              -out "$CERTIFICATE_PATH" \
              -passout "pass:$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/Trooper_Capacitor_App_Store.plist"
          mkdir -p "$PROFILE_DIR"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "APPLE_PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile $PROFILE_NAME ($PROFILE_UUID)"

      - name: Build web fallback and sync Capacitor
        run: |
          set -euo pipefail
          npm run build
          rm -rf apps/capacitor/dist
          mkdir -p apps/capacitor/dist
          cp -R dist/. apps/capacitor/dist/
          npm --prefix apps/capacitor run ios:sync

      - name: Build signed Capacitor iOS IPA
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ env.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.0.3' }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          set -euo pipefail
          APPLE_API_KEY_PATH="$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          ARCHIVE_PATH="$RUNNER_TEMP/TrooperCapacitor.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/TrooperCapacitorExport"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptionsCapacitorAppStore.plist"

          xcodebuild archive \
            -project apps/capacitor/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_SPECIFIER" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.trooper.app</key>
              <string>${APPLE_PROVISIONING_PROFILE_SPECIFIER}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was produced by xcodebuild -exportArchive" >&2
            find "$EXPORT_PATH" -maxdepth 4 -type f >&2 || true
            exit 1
          fi

          VERIFY_PATH="$RUNNER_TEMP/TrooperCapacitorIPA"
          rm -rf "$VERIFY_PATH"
          mkdir -p "$VERIFY_PATH"
          unzip -q "$IPA_PATH" -d "$VERIFY_PATH"
          EXPORTED_APP="$(find "$VERIFY_PATH/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          EXPORTED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXPORTED_APP/Info.plist")"
          EXPORTED_MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXPORTED_APP/Info.plist")"
          EXPORTED_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXPORTED_APP/Info.plist")"
          EXPORTED_SDK_NAME="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$EXPORTED_APP/Info.plist")"

          if [ "$EXPORTED_BUNDLE_ID" != "$BUNDLE_IDENTIFIER" ]; then
            echo "Expected bundle id $BUNDLE_IDENTIFIER, got $EXPORTED_BUNDLE_ID" >&2
            exit 1
          fi
          if [ "$EXPORTED_MARKETING_VERSION" != "$MARKETING_VERSION" ]; then
            echo "Expected marketing version $MARKETING_VERSION, got $EXPORTED_MARKETING_VERSION" >&2
            exit 1
          fi
          if [ "$EXPORTED_BUILD_NUMBER" != "$BUILD_NUMBER" ]; then
            echo "Expected build number $BUILD_NUMBER, got $EXPORTED_BUILD_NUMBER" >&2
            exit 1
          fi
          case "$EXPORTED_SDK_NAME" in
            iphoneos26.*) ;;
            *)
              echo "Expected an iOS 26 SDK build, got $EXPORTED_SDK_NAME" >&2
              exit 1
              ;;
          esac
          codesign --verify --deep --strict --verbose=2 "$EXPORTED_APP"

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Built IPA at $IPA_PATH"

      - name: Upload IPA to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          UPLOAD_LOG="$RUNNER_TEMP/TestFlightUpload.log"
          set +e
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID" \
            --show-progress \
            --verbose 2>&1 | tee "$UPLOAD_LOG"
          UPLOAD_STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$UPLOAD_STATUS" -ne 0 ] ||
             grep -Eiq 'UPLOAD FAILED|Upload failed|Failed to upload|Validation failed' "$UPLOAD_LOG"; then
            echo "App Store Connect rejected the upload." >&2
            exit 1
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trooper-capacitor-ios-testflight-output
          path: |
            ${{ runner.temp }}/TrooperCapacitorExport/**/*.ipa
            ${{ runner.temp }}/TrooperCapacitorExport/**/*.xcdistributionlogs
          if-no-files-found: ignore

      - name: Clean up temporary App Store signing assets
        if: ${{ always() && env.GENERATED_APPLE_CERTIFICATE_ID != '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APPLE_API_KEY_PATH="$API_PRIVATE_KEYS_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
            node scripts/ios/create-app-store-signing-assets.mjs --cleanup
