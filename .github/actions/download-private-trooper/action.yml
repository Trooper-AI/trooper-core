name: Download private Trooper source
description: Fetch a selected private Trooper revision without checking it into this public repository.

inputs:
  ref:
    description: Private Trooper branch, tag, or commit SHA
    required: false
    default: main
  token:
    description: "Fine-grained token with Contents: read on absurdfounder/Trooper"
    required: false
  fallback-token:
    description: Optional second fine-grained read token used when the primary token is expired
    required: false
  clone-token:
    description: Optional git-clone token (TROOPER_REPO_CLONE_TOKEN) used when API-only tokens cannot fetch contents
    required: false
  destination:
    description: Directory where the source is unpacked
    required: false
    default: private-trooper

outputs:
  sha:
    description: Resolved immutable Trooper commit SHA
    value: ${{ steps.record.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Checkout Trooper with primary token
      id: primary
      continue-on-error: true
      uses: actions/checkout@v5
      with:
        repository: absurdfounder/Trooper
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: ${{ inputs.destination }}
        persist-credentials: false
        fetch-depth: 1

    - name: Checkout Trooper with fallback token
      id: fallback
      if: ${{ steps.primary.outcome == 'failure' && inputs.fallback-token != '' }}
      continue-on-error: true
      uses: actions/checkout@v5
      with:
        repository: absurdfounder/Trooper
        ref: ${{ inputs.ref }}
        token: ${{ inputs.fallback-token }}
        path: ${{ inputs.destination }}
        persist-credentials: false
        fetch-depth: 1

    - name: Checkout Trooper with clone token
      id: clone
      if: ${{ steps.primary.outcome == 'failure' && (steps.fallback.outcome == 'failure' || steps.fallback.outcome == 'skipped') && inputs.clone-token != '' }}
      continue-on-error: true
      uses: actions/checkout@v5
      with:
        repository: absurdfounder/Trooper
        ref: ${{ inputs.ref }}
        token: ${{ inputs.clone-token }}
        path: ${{ inputs.destination }}
        persist-credentials: false
        fetch-depth: 1

    - name: Fetch Trooper tarball if git checkout failed
      id: tarball
      if: ${{ steps.primary.outcome == 'failure' && (steps.fallback.outcome == 'failure' || steps.fallback.outcome == 'skipped') && (steps.clone.outcome == 'failure' || steps.clone.outcome == 'skipped') }}
      shell: bash
      env:
        TROOPER_REF: ${{ inputs.ref }}
        DEST: ${{ inputs.destination }}
        PRIMARY_TOKEN: ${{ inputs.token }}
        FALLBACK_TOKEN: ${{ inputs.fallback-token }}
        CLONE_TOKEN: ${{ inputs.clone-token }}
      run: |
        set -euo pipefail
        TMP_TGZ="${RUNNER_TEMP:-/tmp}/trooper-source.tgz"
        resolve_sha() {
          local token="$1"
          curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/absurdfounder/Trooper/commits/${TROOPER_REF}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
        }
        download_tarball() {
          local token="$1"
          local sha="$2"
          rm -f "$TMP_TGZ"
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/absurdfounder/Trooper/tarball/${sha}" \
            -o "$TMP_TGZ"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          tar -xzf "$TMP_TGZ" -C "$DEST" --strip-components=1
          rm -f "$TMP_TGZ"
          test -f "$DEST/package.json"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        }

        tokens=()
        labels=()
        if [ -n "${PRIMARY_TOKEN:-}" ]; then tokens+=("$PRIMARY_TOKEN"); labels+=("CRABSHQ_READ_TOKEN"); fi
        if [ -n "${FALLBACK_TOKEN:-}" ]; then tokens+=("$FALLBACK_TOKEN"); labels+=("CRABSHQ_DISPATCH_TOKEN"); fi
        if [ -n "${CLONE_TOKEN:-}" ]; then tokens+=("$CLONE_TOKEN"); labels+=("TROOPER_REPO_CLONE_TOKEN"); fi
        if [ "${#tokens[@]}" -eq 0 ]; then
          echo "::error::No token provided. Set CRABSHQ_READ_TOKEN (Contents: Read on absurdfounder/Trooper) on Trooper-AI/trooper-core, including the production-build environment."
          exit 1
        fi

        for i in "${!tokens[@]}"; do
          token="${tokens[$i]}"
          label="${labels[$i]}"
          echo "Git checkout missed package.json; trying ${label} via GitHub tarball API"
          if sha="$(resolve_sha "$token")"; then
            if download_tarball "$token" "$sha"; then
              echo "Fetched absurdfounder/Trooper@${sha} with ${label}"
              exit 0
            fi
          else
            echo "::warning::${label} cannot read absurdfounder/Trooper commits API."
          fi
        done
        echo "::error::Could not fetch absurdfounder/Trooper. Refresh CRABSHQ_READ_TOKEN (fine-grained PAT, Contents: Read) on repo secrets AND the production-build environment."
        exit 1

    - name: Record Trooper SHA
      id: record
      shell: bash
      env:
        DEST: ${{ inputs.destination }}
        TARBALL_SHA: ${{ steps.tarball.outputs.sha }}
      run: |
        set -euo pipefail
        if [ ! -f "$DEST/package.json" ]; then
          echo "::error::Could not clone absurdfounder/Trooper. Set CRABSHQ_READ_TOKEN (Contents: Read on absurdfounder/Trooper) on Trooper-AI/trooper-core repo secrets and the production-build environment."
          exit 1
        fi
        sha="${TARBALL_SHA:-}"
        if [ -z "$sha" ] && [ -d "$DEST/.git" ]; then
          sha="$(git -C "$DEST" rev-parse HEAD)"
        fi
        if [ -z "$sha" ]; then
          echo "::error::Could not resolve Trooper SHA."
          exit 1
        fi
        rm -rf "$DEST/.git"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "Using absurdfounder/Trooper@$sha"
        {
          echo "### Private Trooper source"
          echo ""
          echo "Built from \`absurdfounder/Trooper@${sha}\`."
        } >> "$GITHUB_STEP_SUMMARY"
